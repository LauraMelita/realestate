name: Scrape We Invest

on:
  schedule:
    - cron: '21,59 6-17 * * *'
  workflow_dispatch:

jobs:
  scrape:
    if: ${{ vars.ENABLE_WEINVEST_SCRAPER == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run We Invest scraper
        run: npm run scraper weinvest
        env:
          DATABASE: ${{ secrets.DATABASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
